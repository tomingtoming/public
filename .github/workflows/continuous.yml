name: Continuous Integration

on:
  push:
    branches: [ main ]
    tags-ignore:
      - 'v*' # Don't run if tagged as v*.
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: mkdir
      run: mkdir ci_windows
    - name: build
      run: |
          cmake ../src -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release --parallel 4
      working-directory: ./ci_windows



  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: mkdir
      run: mkdir ci_ubuntu
    - name: install-OpenGL
      run: |
          sudo apt-get update
          sudo apt-get install libglu1-mesa-dev mesa-common-dev
    - name: install-ALSA
      run: sudo apt-get install libasound2-dev
    - name: cmake
      run: cmake ../src -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release
      working-directory: ./ci_ubuntu
    - name: build
      run: cmake --build . --config Release --parallel 4
      working-directory: ./ci_ubuntu



  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: mkdir
      run: mkdir ci_macos
    - name: cmake
      run: cmake ../src -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release
      working-directory: ./ci_macos
    - name: build
      run: cmake --build . --parallel 4
      working-directory: ./ci_macos
